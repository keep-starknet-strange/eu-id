name: CI

# Continuous integration for the eu-id workspace.
#
# CI builds, tests, and checks every pull request and every push to `main`.
# These jobs detect regressions in this multi-component cryptographic codebase.
# The end-to-end proof test runs each day because proof generation is slow.
#
# The `lint` job runs `make check`.
# Contributors use the same target locally.

on:
  # `pull_request` covers all feature branch work.
  # `push` covers `main` after a merge.
  # This scope prevents duplicate branch jobs for an open pull request.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run the slow `e2e` job each day at 06:00 UTC.
    # This schedule does not delay push feedback.
    - cron: "0 6 * * *"

# Cancel an obsolete active run for the same reference.
# The event name prevents a push from canceling an active scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 12
  RAYON_NUM_THREADS: 12
  # Surface panic backtraces so failing tests are diagnosable from the log.
  RUST_BACKTRACE: 1

jobs:
  # Run Clippy and rustfmt.
  # `make check` rejects warnings except its explicit proof-oriented style allow-list.
  # Warnings from the Stwo Git dependency do not fail this job.
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15
          components: rustfmt, clippy

      # Cache Cargo registries, Git sources, and compiled artifacts.
      # The `Cargo.lock` key invalidates the cache after a dependency change.
      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Identical to running `make check` locally:
      #   cargo clippy -- -D warnings <declared style allow-list> && cargo fmt -- --check
      - name: make check
        run: make check

  # Run the workspace build and tests in one job.
  # This job compiles the large Stwo dependency once.
  build-test:
    name: Build & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make build
        run: make build

      # The scheduled job runs tests that have the `#[ignore]` attribute.
      - name: make test
        run: make test

  # Run slow full pipeline proof tests only on the schedule.
  # Run tests with the `#[ignore]` attribute in release mode.
  # This job covers end-to-end, composition, and boundary tests.
  e2e:
    name: End-to-end proof generation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run end-to-end proof tests (release, ignored tests only)
        run: make test-ignored

      # Test the standalone component example.
      # This test detects a wrong digest that still compiles.
      # The scheduled job shares its warm cache with the ignored tests.
      - name: Run prove_demo example (release)
        run: cargo run --release -p stwo-sha256 --example prove_demo
