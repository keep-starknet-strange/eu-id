name: CI

# Continuous integration for the eu-id workspace.
#
# Build, test, lint, and dependency isolation run on every pull request and on
# pushes to the quantum-safe branch. Proof generation is slow, so the
# end-to-end proof test is kept off the per-push path and runs daily.
#
# The `lint` job runs `make check` — the exact target contributors run
# locally — so local and CI lint results can never diverge (see the Makefile).

on:
  # `pull_request` covers all feature-branch work. Direct pushes are checked on
  # both the classical trunk and this branch's quantum-safe integration ref.
  push:
    branches: [main, feat/quantum-safe]
  pull_request:
  schedule:
    # 06:00 UTC daily. Exercises the slow end-to-end proof test (the `e2e`
    # job) without slowing down per-push feedback.
    - cron: '0 6 * * *'

# Cancel superseded in-progress runs for the same ref (e.g. rapid successive
# pushes). The event name is part of the key so a push never cancels an
# in-progress scheduled e2e run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface panic backtraces so failing tests are diagnosable from the log.
  RUST_BACKTRACE: 1

jobs:
  # clippy + rustfmt. The `-D warnings` inside `make check` fails the build on
  # any warning; it is scoped to the workspace crates, so warnings from the
  # stwo git dependency never break our CI.
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned Stwo engine patch
        uses: actions/checkout@v4
        with:
          repository: 0xLucqs/stwo
          ref: 8c9983908642f719032e7b7977f3c2081c84a2d9
          path: .stwo-engine

      - name: Materialize local Stwo patch path
        run: |
          sudo mkdir -p /Users/lucas
          sudo ln -s "$GITHUB_WORKSPACE/.stwo-engine" /Users/lucas/stwo

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-07-14
          components: rustfmt, clippy

      # Caches ~/.cargo/registry, ~/.cargo/git (the stwo git-dependency
      # source), and target/ (compiled artifacts, including stwo). Keyed on
      # Cargo.lock, so the heavy stwo build is reused until a dependency bump
      # invalidates the cache.
      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Identical to running `make check` locally:
      #   cargo clippy -- -D warnings && cargo fmt -- --check
      - name: make check
        run: make check

  # cargo build + cargo test --workspace, in a single job so the heavy stwo
  # dependency compiles once and is shared between the two steps.
  build-test:
    name: Build & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned Stwo engine patch
        uses: actions/checkout@v4
        with:
          repository: 0xLucqs/stwo
          ref: 8c9983908642f719032e7b7977f3c2081c84a2d9
          path: .stwo-engine

      - name: Materialize local Stwo patch path
        run: |
          sudo mkdir -p /Users/lucas
          sudo ln -s "$GITHUB_WORKSPACE/.stwo-engine" /Users/lucas/stwo

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-07-14

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check quantum-only dependency tree
        run: make check-quantum-only-deps

      - name: make build
        run: make build

      # `cargo test --workspace` covers every workspace member, so new
      # component crates are picked up automatically once registered. Heavy
      # proof-generation tests are marked `#[ignore]` and run in the scheduled
      # `e2e` job rather than here.
      - name: make test
        run: make test

  # Scheduled-only: slow ignored tests plus one full quantum-safe mdoc probe.
  # Release mode is mandatory because proving in debug is prohibitively slow.
  e2e:
    name: End-to-end proof generation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned Stwo engine patch
        uses: actions/checkout@v4
        with:
          repository: 0xLucqs/stwo
          ref: 8c9983908642f719032e7b7977f3c2081c84a2d9
          path: .stwo-engine

      - name: Materialize local Stwo patch path
        run: |
          sudo mkdir -p /Users/lucas
          sudo ln -s "$GITHUB_WORKSPACE/.stwo-engine" /Users/lucas/stwo

      # Pinned nightly — must match the channel in rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-07-14

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run end-to-end proof tests (release, ignored tests only)
        run: cargo test --locked --workspace --release -- --ignored

      - name: Run full quantum-safe mdoc probe (release, single-thread)
        run: make perf

      # Smoke-test the standalone-component example so it cannot silently
      # rot. The example documents itself as "the shortest path to running
      # the SHA-256 prover"; without an executed-in-CI step a regression
      # that produces a wrong digest but still compiles would slip past
      # `make build`. Runs in the same scheduled job as the ignored tests
      # to share the warm cache.
      - name: Run prove_demo example (release)
        run: cargo run --locked --release -p stwo-sha256 --example prove_demo
