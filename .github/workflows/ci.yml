name: CI

# Continuous integration for the eu-id workspace.
#
# Build, test, lint, and dependency checks run on each pull request and on
# selected branches. Slow proof tests run each day.

on:
  push:
    branches: [main, feat/quantum-safe]
  pull_request:
  schedule:
    # 06:00 UTC daily. Exercises the slow end-to-end proof test (the `e2e`
    # job) without slowing down per-push feedback.
    - cron: '0 6 * * *'

# Cancel an older run for the same event and Git reference.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface panic backtraces so failing tests are diagnosable from the log.
  RUST_BACKTRACE: 1

jobs:
  # Run Clippy and rustfmt.
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the toolchain from rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15
          components: rustfmt, clippy

      # Cache dependencies and build output.
      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: make check
        run: make check

  # Build and test in one job so both steps use the same build cache.
  build-test:
    name: Build & test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Use one Rayon worker to limit peak memory on the shared runner.
    env:
      RAYON_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Use the toolchain from rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check quantum-only dependency tree
        run: make check-quantum-only-deps

      - name: make build
        run: make build

      # The workspace test command includes each workspace crate.
      - name: make test
        run: make test

  # Run slow proof tests in release mode each day.
  e2e:
    name: End-to-end proof generation
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      # Use the toolchain from rust-toolchain.toml.
      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run end-to-end proof tests (release, ignored tests only)
        run: cargo test --locked --workspace --release -- --ignored --test-threads=1

      - name: Run the identity API proof probe
        run: make perf

      # Run the canonical standalone SHA-256 example.
      - name: Run prove_demo example (release)
        run: cargo run --locked --release -p stwo-sha256 --example prove_demo
