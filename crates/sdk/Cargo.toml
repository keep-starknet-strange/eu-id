[package]
name = "sdk"
version.workspace = true
edition.workspace = true

# The EU-ID identity proof SDK exposes the TS13 prover and verifier through UniFFI.
# Callers supply the mdoc bytes and the verifier trust data.
[lib]
# Rust library names cannot contain hyphens.
name = "euid_zk_sdk"
# The cdylib serves Android. The staticlib serves iOS. The rlib serves the
# binding generator.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Enable the binding generator only when you generate bindings.
bindgen = ["uniffi/cli"]

[dependencies]
eu-id-prover = { path = "../eu-id-prover" }
uniffi = { version = "0.29" }
thiserror = "2.0.18"
serde = { workspace = true }
bincode = "1"
rayon = "1"
# Demo-only issuance (`demo` module): explicitly-ordered CBOR assembly and the
# RustCrypto `ml-dsa` signer for the deterministic demo issuer. Same `ml-dsa`
# version the eu-id-prover fixture uses.
ciborium = "0.2.2"
ml-dsa = "0.1.1"
# Issuer-key pins and the TS13 request binding hash are SHA-256 digests.
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
stwo-mldsa = { path = "../stwo-mldsa" }

[[bin]]
# The Android Gradle build uses this binding generator.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true
