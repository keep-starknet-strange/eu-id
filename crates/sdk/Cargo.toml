[package]
name = "sdk"
version.workspace = true
edition.workspace = true

# The EU-ID ZK SDK: the single source of truth for the prover/verifier data
# contract. It owns the contract types, the deterministic-CBOR statement
# encoding (`encode_statement`), and the product `prove_mdoc_pid` /
# `verify_mdoc_pid` entry points. The legacy `prove_identity` /
# `verify_identity` entry points remain for the 11-byte POC path.
#
# The mdoc PID bodies run the real STWO prover/verifier behind the UniFFI
# surface. No Multipaz / verifier-core types leak in; callers pass the CBOR mdoc
# bytes and verifier trust material directly.
[lib]
# Crate/lib identifier -> output filename `libeuid_zk_sdk.so` / `.dylib`. Rust
# lib names can't contain hyphens, so this is the underscore form of euid-zk-sdk.
name = "euid_zk_sdk"
# cdylib -> the `.so`/`.dylib` loaded by the Kotlin bindings on Android.
# staticlib -> iOS static link (deferred). rlib -> lets the bundled
# `uniffi-bindgen` bin link against this crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The default SDK is the classical product: the `ec-coprocessor` P-256 issuer
# path plus the coprocessor-shaped statement-binding layer
# (`mdoc_statement_matches_public_statement` is written against
# `MdocPublicStatement`). The `quantum-safe-mdoc` build swaps the whole
# classical stack out (G8 gate: no p256 / ecdsa / stwo-p256 /
# eu-id-ec-coprocessor in the tree) and binds statements against the in-STARK
# `MdocCircuitStatement` shape instead. At least one of the two must be on.
default = ["p256-mdoc"]
p256-mdoc = ["p256", "eu-id-prover/ec-coprocessor"]
quantum-safe-mdoc = ["ml-dsa", "eu-id-prover/quantum-safe-mdoc"]
# Pulls the binding generator (clap, cargo_metadata, …) into the build. Needed
# ONLY for the `uniffi-bindgen` bin — kept off by default so the SDK cdylib
# does not link the whole generator toolchain into the `.so`.
bindgen = ["uniffi/cli"]
# Issuer signature-scheme passthroughs to eu-id-prover.
p256 = ["eu-id-prover/p256"]
ml-dsa = ["eu-id-prover/ml-dsa"]

[dependencies]
# The prover's relying-party types and entry points. The §9.1 contract mapping
# constructs `Credential` / `Policy` / `PublicStatement` / `Date` / `IssuerKey` /
# `AffinePoint` from the UniFFI types; Phase F wires the SDK product path
# through `prove_mdoc` / `verify_mdoc`, so this is now a proving dependency (it
# drags the whole STWO stack into the cdylib — that footprint is 9.3's concern).
eu-id-prover = { path = "../eu-id-prover", default-features = false }
uniffi = { version = "0.29" }
thiserror = "2.0.18"
# Deterministic CBOR: we build an explicitly-ordered `ciborium::value::Value`
# map, so the same bytes come out on prove and verify sides.
ciborium = "0.2.2"
celes = "2.8.2"
# The combined `Proof` is serde-serializable; bincode is the wire format the FFI
# bench + `eu-id` CLI already use, so the SDK matches it for the proof envelope.
serde = { workspace = true }
bincode = "1"
# FFI transport compression: the SDK keeps its exported byte API stable while
# compressing the inner bincode `Proof` payload carried in `ProofEnvelope`.
bzip2 = "0.6"
sha2 = "0.10"

[[bin]]
# Bundled binding generator. Run as:
#   cargo run -p sdk --bin uniffi-bindgen -- generate \
#     --library <built .so/.dylib> --language kotlin --out-dir <dir>
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Only buildable with the bindgen toolchain; never compiled for the cdylib/.so.
required-features = ["bindgen"]

[lints]
workspace = true
