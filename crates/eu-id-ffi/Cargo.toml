[package]
name = "eu-id-ffi"
version.workspace = true
edition.workspace = true

# This crate provides a small C ABI for the standalone component provers.
# The mobile benchmark harness uses one function for each component.
# Rust measures each workload and returns a flat C structure.
# The iOS component benchmark links an explicitly built `staticlib`.
[lib]
name = "eu_id_ffi"
# Keep Rust builds to one rlib so the final binary can use whole-program LTO.
# The iOS packaging script requests the shipped staticlib explicitly.
crate-type = ["rlib"]

[dependencies]
# Use mimalloc for short-lived trace buffers.
# The standalone component harness uses this allocator for every measurement.
mimalloc = { workspace = true }
# The SHA benchmark calls the standalone SHA-256 prover directly.
stwo-sha256 = { path = "../stwo-sha256" }
# P-256 ECDSA verification prover. It enables the one Rayon-backed Stwo path.
stwo-p256 = { path = "../stwo-p256" }
# This direct dependency names the `Blake2sMerkleChannel` concrete type.
stwo = { workspace = true }
# Sample the peak memory footprint.
# On Apple systems, `physical_mem` uses the `phys_footprint` jetsam metric.
memory-stats = "1.2"
# Test only.
# Produce a real P-256 signature for the big-endian `(z, r, s, qx, qy)` contract.
# The host build uses Swift CryptoKit and does not include these dependencies.
[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

[lints]
workspace = true
