[package]
name = "eu-id-ffi"
version.workspace = true
edition.workspace = true

# Thin C-ABI surface for the quantum-safe mobile build. The current benchmark
# entry point measures the standalone SHA-256 prover; the quantum-safe mdoc
# dependency graph. iOS links the `staticlib`; Android (later) the `cdylib`.
[lib]
name = "eu_id_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Pass through to multi-threaded Stwo proving (rayon).
parallel = ["stwo-sha256/parallel", "eu-id-prover/parallel"]
# Benchmark-only Android entry point. The fixture dependencies are optional so
# the existing C/iOS surface does not carry the deterministic ML-DSA signer.
jni = [
    "dep:bincode",
    "dep:ciborium",
    "dep:jni",
    "dep:libc",
    "dep:ml-dsa",
    "dep:rayon",
    "dep:sha2",
    "dep:stwo-mldsa",
]

[dependencies]
# malloc showed up at ~4% of single-core prove in profiles. Same allocator the
# criterion benches pin, so bench and production numbers agree.
mimalloc = { workspace = true }
# Keep the quantum-safe prover graph available to future product bindings. The
# standalone SHA benchmark depends on stwo-sha256 directly.
eu-id-prover = { path = "../eu-id-prover" }
stwo-sha256 = { path = "../stwo-sha256" }
# Peak-footprint sampler. On Apple `physical_mem` resolves to mach
# `phys_footprint` — the iOS jetsam metric — the same crate the laptop
# harness used.
memory-stats = { version = "1.2", features = ["always_use_statm"] }
# Android full-PQ benchmark glue and deterministic fixture dependencies.
bincode = { version = "1", optional = true }
ciborium = { version = "0.2.2", optional = true }
jni = { version = "0.21", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
ml-dsa = { version = "0.1.1", optional = true }
rayon = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
stwo-mldsa = { path = "../stwo-mldsa", optional = true }

[lints]
workspace = true
