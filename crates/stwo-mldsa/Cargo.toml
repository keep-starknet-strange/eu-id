[package]
name = "stwo-mldsa"
version.workspace = true
edition.workspace = true

[dependencies]
# Native SHAKE-128 and SHAKE-256 for the ML-DSA reference implementation.
# The reference records absorb and squeeze streams for circuit tests.
sha3 = "0.10"
# Serialize the ML-DSA verification input and proof envelopes.
serde = { workspace = true }
# AIR and STARK dependencies for ML-DSA constraints.
stwo.workspace = true
stwo-constraint-framework.workspace = true
air-core = { path = "../air-core" }
# In-circuit Keccak for the µ, c̃, and SampleInBall chains.
# The sponge shares `HashIoRelation` with the ML-DSA bindings.
stwo-keccak = { path = "../stwo-keccak" }
num-traits.workspace = true

[dev-dependencies]
# Oracle cross-check. RustCrypto `ml-dsa` (FIPS 204 final) generates the
# keypairs + signatures the property test verifies with our reference, and
# supplies the KAT fallback if the vendored ACVP vectors are unavailable. Our
# runtime code never depends on it — dev-only.
ml-dsa = "0.1.1"
rand = "0.8"
hex = "0.4"
serde_json = "1"
bincode = "1"

[lints]
workspace = true
