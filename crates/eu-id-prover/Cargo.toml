[package]
name = "eu-id-prover"
version.workspace = true
edition.workspace = true

[features]
default = ["ec-coprocessor", "p256"]
# Forward Stwo's rayon paths to the SHA module. Cargo unifies the single `stwo`
# dependency, so this also turns on the shared STARK prover's parallel paths for
# the whole composition. Off by default: the honest baseline is single-threaded.
# The combined proof is dominated by P256 trace generation, which has no rayon
# path, so enabling this mainly speeds the SHA stage and barely moves the full
# pipeline — the laptop benchmark quantifies the delta.
parallel = ["stwo-sha256/parallel"]
gkr-spike = ["air-core/gkr-spike", "stwo-sha256/gkr-spike"]
fri-sweep = ["stwo/tracing"]
# `ec-coprocessor` is a P-256 issuer proving path, so it implies `p256`.
ec-coprocessor = ["dep:eu-id-ec-coprocessor", "p256"]
# Issuer signature schemes. Enabling a feature compiles in that issuer proving
# path; runtime COSE-alg dispatch operates within the compiled-in set. At least
# one must be enabled (enforced by a `compile_error!` in lib.rs). `p256` owns
# the ENTIRE classical stack: the RustCrypto `p256`/`ecdsa` oracles, the
# stwo-p256 in-circuit module, and every P-256 device/revocation/issuer code
# path. A build without `p256` carries no classical public-key crypto at all
# (the G8 quantum-only dependency-tree gate enforces this).
p256 = ["dep:p256", "dep:ecdsa", "dep:stwo-p256"]
# ML-DSA-65 issuer path: pulls the hosted in-circuit stwo-mldsa module.
ml-dsa = ["dep:stwo-mldsa"]
# Quantum-safe product alias: ML-DSA issuer + device + revocation, no
# classical public-key crypto in the dependency tree when built with
# --no-default-features.
quantum-safe-mdoc = ["ml-dsa"]

[dependencies]
air-core = { path = "../air-core" }
eu-id-ec-coprocessor = { path = "../eu-id-ec-coprocessor", optional = true }
stwo-p256 = { path = "../stwo-p256", optional = true }
# ML-DSA-65 issuer-auth statement (M7): COSE alg -49 issuerAuth is parsed,
# natively pre-checked, and proven in-circuit by the hosted stwo-mldsa module.
# Optional: only compiled in under the `ml-dsa` feature.
stwo-mldsa = { path = "../stwo-mldsa", optional = true }
stwo-sha256 = { path = "../stwo-sha256" }
predicates = { path = "../predicates" }
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true, features = ["parallel"] }

# Proof (de)serialization for the `eu-id` CLI: `prove` writes a proof file,
# `verify` reads it back. The combined `Proof` derives serde over the per-module
# claims (P256 / SHA / bridge claim trees made serde-serializable for this).
serde = { workspace = true }
bincode = "1"
blake2 = "0.10"

# Reference oracles. These back the POC's native credential generator and its
# end-to-end self-validation (the SPEC's "property-based testing against a
# reference oracle" mitigation). They are reachable from the public
# `generator`/`fixtures` API on purpose: every later binding task diffs against
# a trusted witness rather than a guess, and integration tests in `tests/`
# (which see only the public surface) consume the fixtures.
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
ecdsa = { version = "0.16", features = ["signing", "verifying"], optional = true }
sha2 = "0.10"
# OS randomness for the claimed-sum blinders (scheme-neutral; previously
# reached through the `p256` crate's rand_core re-export, but the blinders are
# needed by the quantum-safe build too, so the dependency is direct).
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"
ciborium = "0.2.2"
celes = "2.8.2"

[dev-dependencies]
# Laptop benchmark (`benches/identity_bench.rs`, `examples/bench_report.rs`):
# criterion for statistical prove/verify timing; memory-stats for the peak
# `phys_footprint` sampler — the same crate and metric the FFI / mobile harness
# uses, so the per-stage memory numbers are directly comparable; serde_json to
# emit the machine-readable results file.
criterion = { version = "0.5", features = ["html_reports"] }
memory-stats = "1.2"
serde_json = "1"
mimalloc = { workspace = true }
# Proof-size byte-breakdown (§10.1, `examples/bench_report`): mirror the SDK's
# FFI transport compressor (`bzip2` best) so the recorded over-the-wire size and
# compression ratio match the real Bluetooth payload (`crates/sdk` uses 0.6).
bzip2 = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
# ML-DSA-65 mdoc fixture (M1): the RustCrypto `ml-dsa` oracle signs the issuer
# `Sig_structure`; `stwo-mldsa` (now a main dependency) natively verifies it.
ml-dsa = "0.1.1"

# The `eu-id` CLI drives the legacy P-256 identity pipeline, so it only
# exists in builds that carry the classical stack.
[[bin]]
name = "eu-id"
path = "src/bin/eu-id.rs"
required-features = ["p256"]

[[bench]]
name = "identity_bench"
harness = false

[[bench]]
name = "longfellow_equiv_bench"
harness = false

[[bench]]
name = "mdoc_bench"
harness = false

[[example]]
name = "fri_sweep"
required-features = ["fri-sweep"]

# Full-PQ mdoc perf probe (S3 campaign gate). Hosted build only:
# --no-default-features --features "p256,ml-dsa".
[[example]]
name = "pq_perf_probe"
required-features = ["ml-dsa"]

[lints]
workspace = true
