[package]
name = "eu-id-prover"
version.workspace = true
edition.workspace = true

[dependencies]
air-core = { path = "../air-core" }
stwo-mldsa = { path = "../stwo-mldsa" }
stwo-sha256 = { path = "../stwo-sha256" }
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true, features = ["parallel"] }

# Proof serialization.
serde = { workspace = true }
