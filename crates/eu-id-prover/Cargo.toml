[package]
name = "eu-id-prover"
version.workspace = true
edition.workspace = true

[features]
prove-profile = ["air-core/prove-profile"]

[dependencies]
air-core = { path = "../air-core" }
eu-id-ec-coprocessor = { path = "../eu-id-ec-coprocessor" }
stwo-p256 = { path = "../stwo-p256" }
stwo-sha256 = { path = "../stwo-sha256" }
predicates = { path = "../predicates" }
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true }

# Serialize the current product proof and bind its coprocessor bundle.
serde = { workspace = true }
bincode = "1"
blake2 = "0.10"

# Parse and verify the current mdoc profile and build deterministic test data.
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
sha2 = "0.10"
ciborium = "0.2.2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
