[package]
name = "eu-id-prover"
version.workspace = true
edition.workspace = true

[features]
# Forward Stwo's rayon paths to the SHA module. Cargo unifies the single `stwo`
# dependency, so this also turns on the shared STARK prover's parallel paths for
# the whole composition. Off by default: the honest baseline is single-threaded.
parallel = ["stwo-sha256/parallel"]

[dependencies]
air-core = { path = "../air-core" }
stwo-mldsa = { path = "../stwo-mldsa" }
stwo-sha256 = { path = "../stwo-sha256" }
predicates = { path = "../predicates" }
stwo = { workspace = true }
stwo-constraint-framework = { workspace = true, features = ["parallel"] }

# Product proof serialization.
serde = { workspace = true }
bincode = "1"
blake2 = "0.10"

sha2 = "0.10"
# OS randomness for claimed-sum blinders.
rand = "0.8"
rayon = "1"
ciborium = "0.2.2"
celes = "2.8.2"

[dev-dependencies]
serde_json = "1"
# ML-DSA-65 mdoc fixture (M1): the RustCrypto `ml-dsa` oracle signs the issuer
# `Sig_structure`; `stwo-mldsa` (now a main dependency) natively verifies it.
ml-dsa = "0.1.1"

# Full-PQ mdoc performance probe.
[[example]]
name = "pq_perf_probe"

[lints]
workspace = true
