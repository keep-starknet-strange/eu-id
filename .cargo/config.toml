[alias]
# Run all predicate benchmarks
bench-predicates = "bench -p predicates"

# Compile benchmarks without running (fast check that they build)
bench-check = "bench -p predicates --no-run"

prove = "run --bin prove --"
verify = "run --bin verify --"

##### Profiling
# Age predicate — range check
profile-prove-age-rc = "instruments -t Allocations --manifest-path crates/predicates/Cargo.toml --bin prove --release -- age --dob 1990-01-01 --output target/instruments/age-rc.bin"
profile-verify-age-rc = "instruments -t Allocations --manifest-path crates/predicates/Cargo.toml --bin verify --release -- age --input target/instruments/age-rc.bin"

# Age predicate — bit decomposition
profile-prove-age-bd = "instruments -t Allocations --manifest-path crates/predicates/Cargo.toml --bin prove --release -- age --dob 1990-01-01 --strategy bd --output target/instruments/age-bd.bin"
profile-verify-age-bd = "instruments -t Allocations --manifest-path crates/predicates/Cargo.toml --bin verify --release -- age --strategy bd --input target/instruments/age-bd.bin"