# XcodeGen specification for the EU ID mobile benchmark harness.
# Use this command to generate the project:
# cd mobile/EuIdBench && xcodegen generate
#
# The application links `EuId.xcframework` as a static library.
# `crates/eu-id-ffi/build-xcframework.sh` creates the framework.
# A bridge header calls the prover C ABI.
# The application has one tab for each benchmark workload.
name: EuIdBench
options:
  bundleIdPrefix: co.starkware.euid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EuIdBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # Link the XCFramework static library into the application binary.
      - framework: ../../crates/eu-id-ffi/EuId.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.starkware.euid.bench
        # Use automatic code signing.
        # Set `DEVELOPMENT_TEAM` before you run `xcodegen generate`.
        # The `-allowProvisioningUpdates` option registers the device.
        # It also creates a development profile for the first device build.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The bridge header includes the C ABI from `eu_id_ffi.h`.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/EuIdBench-Bridging-Header.h
        # Add the path for `eu_id_ffi.h`.
        HEADER_SEARCH_PATHS:
          - ../../crates/eu-id-ffi/include
        # The Rust static library needs the C++ runtime and system libraries.
        OTHER_LDFLAGS:
          - -lc++
        # Keep the application in the foreground during a long phone benchmark.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
