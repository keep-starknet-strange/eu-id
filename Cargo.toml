[workspace]
members = [
    "crates/air-core",
    "crates/stwo-p256",
    "crates/stwo-p256-utils",
    "crates/stwo-sha256",
    "crates/predicates",
    "crates/eu-id-ec-coprocessor",
    "crates/eu-id-prover",
    "crates/eu-id-ffi",
    "crates/sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 2

[workspace.dependencies]
stwo = { git = "https://github.com/0xLucqs/stwo.git", rev = "8c9983908642f719032e7b7977f3c2081c84a2d9", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/0xLucqs/stwo.git", rev = "8c9983908642f719032e7b7977f3c2081c84a2d9", features = ["prover"] }
serde = { version = "1", features = ["derive"] }
num-traits = "0.2"
mimalloc = "0.1"

# Workspace lint configuration.
# Each crate uses `[lints] workspace = true`.
# This gives all crates one Clippy baseline.
# `make check` uses `-D warnings` and makes each warning an error.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
