[workspace]
members = [
    "crates/air-core",
    "crates/stwo-p256",
    "crates/stwo-p256-utils",
    "crates/stwo-sha256",
    "crates/predicates",
    "crates/eu-id-prover",
    "crates/eu-id-ffi",
    "crates/sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
stwo = { git = "https://github.com/0xLucqs/stwo.git", rev = "116b03c010988d1837222594bd290a086db2a1a9", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/0xLucqs/stwo.git", rev = "116b03c010988d1837222594bd290a086db2a1a9", features = ["prover"] }
serde = { version = "1", features = ["derive"] }
num-traits = "0.2"
mimalloc = "0.1"

# Workspace-wide lint configuration. Every crate opts in with `[lints]
# workspace = true`, so the whole workspace shares one clippy baseline and a
# single place to tighten it. `make check` runs clippy with `-D warnings`,
# which escalates every lint below to a hard error in CI.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch."https://github.com/0xLucqs/stwo.git"]
stwo = { path = "/private/tmp/stwo-dev-copy/crates/stwo" }
stwo-constraint-framework = { path = "/private/tmp/stwo-dev-copy/crates/constraint-framework" }
