[workspace]
members = [
    "crates/air-core",
    "crates/stwo-p256",
    "crates/stwo-p256-utils",
    "crates/stwo-sha256",
    "crates/predicates",
    "crates/eu-id-ffi",
]
resolver = "2"

[profile.release]
debug = true

[workspace.dependencies]
stwo = { git = "https://github.com/starkware-libs/stwo.git", rev = "e1286720e5a6352cae79cc1201c322d5e02ab52f", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo.git", rev = "e1286720e5a6352cae79cc1201c322d5e02ab52f", features = ["prover"] }
serde = { version = "1", features = ["derive"] }
num-traits = "0.2"

# Workspace-wide lint configuration. Every crate opts in with `[lints]
# workspace = true`, so the whole workspace shares one clippy baseline and a
# single place to tighten it. `make check` runs clippy with `-D warnings`,
# which escalates every lint below to a hard error in CI.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
