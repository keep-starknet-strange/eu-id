[workspace]
members = [
    "crates/air-core",
    "crates/stwo-p256",
    "crates/stwo-p256-utils",
    "crates/stwo-sha256",
    "crates/predicates",
    "crates/eu-id-ec-coprocessor",
    "crates/eu-id-prover",
    "crates/eu-id-ffi",
    "crates/sdk",
    "crates/stwo-keccak",
    "crates/stwo-mldsa",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
stwo = { git = "https://github.com/0xLucqs/stwo.git", rev = "72b638e79263d90815069a4819bb22f3f3fb013c", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/0xLucqs/stwo.git", rev = "72b638e79263d90815069a4819bb22f3f3fb013c", features = ["prover"] }
serde = { version = "1", features = ["derive"] }
num-traits = "0.2"
mimalloc = "0.1"

# Workspace-wide lint configuration. Every crate opts in with `[lints]
# workspace = true`, so the whole workspace shares one clippy baseline and a
# single place to tighten it. `make check` runs clippy with `-D warnings`,
# which escalates every lint below to a hard error in CI.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
